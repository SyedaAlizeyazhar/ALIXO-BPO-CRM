<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CRM Designs v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: #0d0f14; }
  .picker { position: sticky; top: 0; z-index: 100; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 14px 20px; background: #0d0f14; color: #fff; border-bottom: 1px solid #1f2430; }
  .picker b { margin-right: 10px; font-size: 14px; }
  .picker button { font: 500 13px "Plus Jakarta Sans", sans-serif; border: 1px solid #2c3342; background: transparent; color: #c6cbd6; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: .2s; }
  .picker button:hover { border-color: #5b6477; color: #fff; }
  .picker button.on { background: #fff; color: #111; border-color: #fff; }
  .picker .desc { flex-basis: 100%; font-size: 12.5px; color: #8b93a5; margin-top: 4px; }
  .stage { padding: 22px 16px 60px; }

  /* ================= shared skeleton ================= */
  .frame {
    --radius: 18px;
    position: relative; isolation: isolate; overflow: hidden;
    max-width: 1320px; margin: 0 auto; border-radius: 22px;
    background: var(--bg); color: var(--text); font-family: var(--font);
    box-shadow: 0 30px 80px rgba(0,0,0,.35);
  }
  .fx { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .fx i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
  .fx i:nth-child(1) { width: 480px; height: 480px; left: -120px; top: -140px; background: var(--blob1); }
  .fx i:nth-child(2) { width: 420px; height: 420px; right: -100px; top: 120px; background: var(--blob2); animation-duration: 22s; }
  .fx i:nth-child(3) { width: 380px; height: 380px; left: 35%; bottom: -160px; background: var(--blob3); animation-duration: 26s; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.15); } }

  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 900px; }

  .side { background: var(--side-bg); color: var(--side-text); padding: 26px 18px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--side-border, transparent); backdrop-filter: blur(18px); }
  .logo { display: flex; align-items: center; gap: 12px; margin: 0 8px 30px; font-weight: 800; font-size: 19px; color: var(--side-strong, var(--text)); }
  .logo i { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-style: normal; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 22px var(--glow); }
  .logo small { display: block; font-size: 11px; font-weight: 500; opacity: .6; letter-spacing: .08em; text-transform: uppercase; }
  .navlbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .5; margin: 8px 12px 6px; }
  .nav a { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; color: inherit; text-decoration: none; transition: background .25s, color .25s, transform .25s; }
  .nav a svg { width: 19px; height: 19px; flex: none; opacity: .85; }
  .nav a:hover { background: var(--side-hover); transform: translateX(3px); }
  .nav a.on { background: var(--side-active-bg); color: var(--side-active-text); font-weight: 700; box-shadow: var(--side-active-shadow, none); }
  .nav a .badge { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff; }
  .side-foot { margin-top: auto; padding: 16px; border-radius: 16px; background: var(--side-card); display: flex; align-items: center; gap: 12px; }
  .side-foot .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.2); animation: pulse 2s infinite; }
  .side-foot b { display: block; font-size: 13px; color: var(--side-strong, var(--text)); }
  .side-foot span { font-size: 12px; opacity: .65; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } }

  .content { padding: 26px 32px 40px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .top h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .top p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 13px; min-width: 240px; }
  .iconbtn { position: relative; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .iconbtn::after { content: ""; position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); }
  .avatar { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); flex: none; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--card-shadow, none); backdrop-filter: blur(16px); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
  .card:hover { transform: translateY(-4px); box-shadow: var(--card-shadow-hover, 0 18px 40px rgba(0,0,0,.12)); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .card h3 { margin: 0 0 16px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .card h3 small { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .chip.up { background: var(--up-bg); color: var(--up); }
  .chip.live { background: var(--up-bg); color: var(--up); }
  .chip.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .row1 { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  .hero { position: relative; overflow: hidden; background: var(--hero-bg); color: var(--hero-text, #fff); border: 0; }
  .hero .lbl { font-size: 13px; opacity: .85; }
  .hero .big { font-size: 46px; font-weight: 800; letter-spacing: -.03em; margin: 6px 0 2px; }
  .hero .sub { font-size: 12.5px; opacity: .8; }
  .hero svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 55%; }
  .hero .area { fill: rgba(255,255,255,.18); }
  .hero .ln { fill: none; stroke: #fff; stroke-width: 2.5; stroke-dasharray: 800; stroke-dashoffset: 800; animation: draw 2s .3s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .mini .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px; }
  .mini .ic svg { width: 20px; height: 20px; }
  .mini .n { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .mini .l { font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
  .mini .spark { width: 100%; height: 34px; margin-top: 8px; }
  .mini .spark path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.6s .5s ease forwards; }

  .row2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; margin-bottom: 18px; }
  .chart { width: 100%; height: 210px; }
  .chart .grid line { stroke: var(--line); }
  .chart .bars rect { transform-origin: bottom; transform-box: fill-box; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleY(0); } }
  .chart text { font-size: 10px; fill: var(--muted); font-family: var(--font); }
  .legend { display: flex; gap: 18px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  .agents { display: flex; flex-direction: column; gap: 12px; }
  .agent { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; transition: background .2s; }
  .agent:hover { background: var(--hover); }
  .agent .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; }
  .agent b { display: block; font-size: 14px; }
  .agent span { font-size: 12px; color: var(--muted); }
  .agent .score { margin-left: auto; text-align: right; }
  .agent .score b { font-size: 16px; }
  .medal { font-size: 18px; width: 22px; text-align: center; }

  .row3 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 0 10px 12px; }
  td { padding: 12px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
  .row3 > .card:first-child { overflow-x: auto; }
  tbody tr { transition: background .2s; }
  tbody tr:hover { background: var(--hover); }
  td .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  td .who i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #fff; }
  .st { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .st.ok { background: var(--up-bg); color: var(--up); }
  .st.dup { background: var(--warn-bg); color: var(--warn); }

  .quick { display: flex; flex-direction: column; gap: 12px; }
  .inp { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .inp input, .inp select { font: 500 14px var(--font); color: var(--text); background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .inp input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { font: 700 14px var(--font); color: #fff; border: 0; border-radius: 12px; padding: 13px 18px; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 10px 24px var(--glow); transition: transform .2s, box-shadow .2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px var(--glow); }
  .dupebox { display: flex; gap: 10px; }
  .dupebox input { flex: 1; }
  .ok-msg { font-size: 12.5px; color: var(--up); font-weight: 600; }

  /* =============== 1. AURORA DARK =============== */
  .t1 { --font: "Plus Jakarta Sans", sans-serif; --bg: #0b0e1a; --text: #eef1ff; --muted: #8c93b3; --panel: rgba(255,255,255,.045); --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.05); --input-bg: rgba(255,255,255,.04);
    --accent: #6366f1; --accent2: #22d3ee; --glow: rgba(99,102,241,.35);
    --blob1: #4f46e5; --blob2: #0891b2; --blob3: #9333ea;
    --side-bg: rgba(10,13,26,.55); --side-text: #a7aecb; --side-border: rgba(255,255,255,.06); --side-hover: rgba(255,255,255,.05); --side-active-bg: linear-gradient(135deg, rgba(99,102,241,.35), rgba(34,211,238,.18)); --side-active-text: #fff; --side-card: rgba(255,255,255,.05);
    --hero-bg: linear-gradient(135deg, #6366f1, #22d3ee); --up: #34d399; --up-bg: rgba(52,211,153,.14); --warn: #fbbf24; --warn-bg: rgba(251,191,36,.14);
    --card-shadow-hover: 0 18px 50px rgba(99,102,241,.25); }

  /* =============== 2. VIBRANT LIGHT =============== */
  .t2 { --font: "Outfit", sans-serif; --bg: #f5f6fb; --text: #1b1d3a; --muted: #7b7f9e; --panel: #fff; --line: #eceef6; --hover: #f7f7fd; --input-bg: #f7f8fc;
    --accent: #7c3aed; --accent2: #f43f5e; --glow: rgba(124,58,237,.22);
    --blob1: #ddd6fe; --blob2: #fecdd3; --blob3: #bfdbfe;
    --side-bg: #fff; --side-text: #6b6f8e; --side-border: #eceef6; --side-hover: #f5f3ff; --side-active-bg: linear-gradient(135deg, #7c3aed, #f43f5e); --side-active-text: #fff; --side-active-shadow: 0 10px 22px rgba(124,58,237,.3); --side-card: #f5f3ff;
    --hero-bg: linear-gradient(135deg, #7c3aed, #db2777 60%, #f97316); --up: #059669; --up-bg: #d1fae5; --warn: #d97706; --warn-bg: #fef3c7;
    --card-shadow: 0 4px 20px rgba(27,29,58,.04); --card-shadow-hover: 0 18px 40px rgba(124,58,237,.14); }
  .t2 .fx i { opacity: .7; }

  /* =============== 3. MIDNIGHT PRO (purple sidebar, bold colour cards) =============== */
  .t3 { --font: "Manrope", sans-serif; --bg: #f1f3f9; --text: #151a30; --muted: #737a96; --panel: #fff; --line: #e7eaf3; --hover: #f5f7fc; --input-bg: #f5f7fc;
    --accent: #4f46e5; --accent2: #06b6d4; --glow: rgba(79,70,229,.25);
    --blob1: transparent; --blob2: transparent; --blob3: transparent;
    --side-bg: linear-gradient(180deg, #1e1b4b, #111034); --side-text: #a5a8d6; --side-strong: #fff; --side-hover: rgba(255,255,255,.06); --side-active-bg: rgba(255,255,255,.12); --side-active-text: #fff; --side-active-shadow: inset 3px 0 0 #22d3ee; --side-card: rgba(255,255,255,.07);
    --hero-bg: linear-gradient(135deg, #4f46e5, #7c3aed); --up: #059669; --up-bg: #d1fae5; --warn: #d97706; --warn-bg: #fef3c7;
    --card-shadow: 0 2px 10px rgba(21,26,48,.04); --card-shadow-hover: 0 18px 40px rgba(79,70,229,.14); }
  .t3 .mini { color: #fff; border: 0; }
  .t3 .mini .l { color: rgba(255,255,255,.8); }
  .t3 .mini .ic { background: rgba(255,255,255,.2) !important; color: #fff !important; }
  .t3 .mini .spark path { stroke: #fff !important; }
  .t3 .mini:nth-child(2) { background: linear-gradient(135deg, #06b6d4, #0ea5e9); }
  .t3 .mini:nth-child(3) { background: linear-gradient(135deg, #f59e0b, #f97316); }
  .t3 .mini:nth-child(4) { background: linear-gradient(135deg, #ec4899, #f43f5e); }
  .t3 .mini .chip.up { background: rgba(255,255,255,.22); color: #fff; }

  /* =============== 4. EMERALD NIGHT (fewer boxes, lines) =============== */
  .t4 { --font: "Outfit", sans-serif; --bg: #07130f; --text: #e8f5ee; --muted: #7fa293; --panel: transparent; --line: rgba(163,230,53,.12); --hover: rgba(163,230,53,.05); --input-bg: rgba(255,255,255,.03);
    --accent: #10b981; --accent2: #a3e635; --glow: rgba(16,185,129,.3);
    --blob1: #065f46; --blob2: #365314; --blob3: #064e3b;
    --side-bg: rgba(4,12,9,.6); --side-text: #8fb5a4; --side-border: rgba(163,230,53,.1); --side-hover: rgba(163,230,53,.06); --side-active-bg: rgba(163,230,53,.1); --side-active-text: #bef264; --side-active-shadow: inset 3px 0 0 #a3e635; --side-card: rgba(163,230,53,.06);
    --hero-bg: linear-gradient(135deg, #059669, #65a30d); --up: #a3e635; --up-bg: rgba(163,230,53,.12); --warn: #fbbf24; --warn-bg: rgba(251,191,36,.12);
    --radius: 0; }
  .t4 .card { border: 0; border-top: 1px solid var(--line); padding: 20px 4px; backdrop-filter: none; }
  .t4 .card:hover { transform: none; box-shadow: none; }
  .t4 .hero { border-radius: 20px; padding: 22px; }
  .t4 .search, .t4 .iconbtn { background: rgba(255,255,255,.03); }
  .t4 .fx i { opacity: .35; }

  /* =============== 5. SUNSET GLASS =============== */
  .t5 { --font: "Plus Jakarta Sans", sans-serif; --bg: linear-gradient(135deg, #fff1eb, #ffe4f1 45%, #e9e5ff); --text: #2a1f3d; --muted: #8a7a99; --panel: rgba(255,255,255,.55); --line: rgba(255,255,255,.8); --hover: rgba(255,255,255,.6); --input-bg: rgba(255,255,255,.7);
    --accent: #f97316; --accent2: #ec4899; --glow: rgba(236,72,153,.25);
    --blob1: #fdba74; --blob2: #f9a8d4; --blob3: #c4b5fd;
    --side-bg: rgba(255,255,255,.4); --side-text: #7a6a8a; --side-border: rgba(255,255,255,.8); --side-hover: rgba(255,255,255,.6); --side-active-bg: #fff; --side-active-text: #ea580c; --side-active-shadow: 0 8px 20px rgba(249,115,22,.18); --side-card: rgba(255,255,255,.6);
    --hero-bg: linear-gradient(135deg, #f97316, #ec4899); --up: #059669; --up-bg: rgba(16,185,129,.14); --warn: #d97706; --warn-bg: rgba(245,158,11,.16);
    --card-shadow: 0 8px 30px rgba(236,72,153,.08); --card-shadow-hover: 0 20px 44px rgba(236,72,153,.18); --radius: 22px; }
  .t5 .fx i { opacity: .6; }

  @media (max-width: 1100px) {
    .row1 { grid-template-columns: 1fr 1fr; }
    .row2, .row3 { grid-template-columns: 1fr; }
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .side { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .logo { margin: 0 12px 0 0; }
    .nav { display: flex; flex-wrap: wrap; gap: 4px; }
    .navlbl, .side-foot { display: none; }
    .search { display: none; }
    .content { padding: 20px 16px; }
    .row1 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="picker" id="picker">
    <b>CRM designs v2:</b>
    <button data-t="1" class="on">1 · Aurora Dark</button>
    <button data-t="2">2 · Vibrant Light</button>
    <button data-t="3">3 · Midnight Pro</button>
    <button data-t="4">4 · Emerald Night</button>
    <button data-t="5">5 · Sunset Glass</button>
    <span class="desc" id="desc"></span>
  </div>
  <div class="stage"><div id="mount"></div></div>

<script>
const DESC = {
  1: "Dark background mein halki hilti hui aurora roshni, sheeshe jaise cards, neela-cyan gradient. Modern lekin over nahi.",
  2: "Light aur rangeen — purple/pink/orange gradient hero, safed cards, colourful icons. Fresh aur energetic.",
  3: "Gehra purple sidebar, har stat ka apna bold rangeen card. Premium dashboard jaisa look.",
  4: "Dark green + lime accent, cards ki jagah sirf lines — sab se kam boxes. Clean aur sharp.",
  5: "Peach-pink-lavender gradient, frosted glass panels, soft aur warm. Sab se friendly look."
};
const I = {
  dash: '<path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z" fill="currentColor"/>',
  lead: '<path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5z" fill="currentColor"/>',
  dupe: '<path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 10-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z" fill="currentColor"/>',
  camp: '<path d="M3 11l18-7-7 18-2.5-7.5z" fill="currentColor"/>',
  prog: '<path d="M5 21V9h3v12zm7 0V3h3v18zm7 0v-7h3v7z" fill="currentColor"/>',
  tool: '<path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.7 4.7C.6 7.1 1 10.1 3 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1 0-1.4z" fill="currentColor"/>',
  search: '<path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 10-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z" fill="currentColor"/>',
  bell: '<path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11a6 6 0 00-5-5.9V4a1 1 0 10-2 0v1.1A6 6 0 006 11v5l-2 2v1h16v-1z" fill="currentColor"/>',
  phone: '<path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.6 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.4 11.4 0 00.6 3.6 1 1 0 01-.25 1z" fill="currentColor"/>',
  copy: '<path d="M16 1H4a2 2 0 00-2 2v14h2V3h12zm3 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11z" fill="currentColor"/>',
  users: '<path d="M16 11a3 3 0 100-6 3 3 0 000 6zm-8 0a3 3 0 100-6 3 3 0 000 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z" fill="currentColor"/>'
};
const ICON_COLORS = [["#e0e7ff", "#4f46e5"], ["#cffafe", "#0891b2"], ["#fef3c7", "#d97706"], ["#fce7f3", "#db2777"]];
const AV = ["#6366f1", "#06b6d4", "#f59e0b", "#ec4899", "#10b981", "#8b5cf6"];

function spark(pts, color) {
  const w = 200, h = 34, max = Math.max(...pts), min = Math.min(...pts);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${(i / (pts.length - 1)) * w},${h - 4 - ((p - min) / (max - min || 1)) * (h - 8)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" stroke="${color}"/></svg>`;
}
function area(pts) {
  const w = 400, h = 120, max = Math.max(...pts);
  const xy = pts.map((p, i) => [(i / (pts.length - 1)) * w, h - (p / max) * (h - 16)]);
  let d = `M${xy[0][0]},${xy[0][1]}`;
  for (let i = 1; i < xy.length; i++) { const [x0, y0] = xy[i - 1], [x1, y1] = xy[i], cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="area" d="${d} L${w},${h} L0,${h}Z"/><path class="ln" d="${d}"/></svg>`;
}
function bars() {
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], a = [42, 55, 38, 61, 70, 48, 35], b = [30, 41, 29, 44, 52, 33, 22];
  const W = 520, H = 190, bw = 18, gap = W / 7;
  let g = "", x;
  for (let i = 0; i < 5; i++) g += `<line x1="30" x2="${W}" y1="${10 + i * 40}" y2="${10 + i * 40}"/>`;
  let r = "";
  days.forEach((d, i) => {
    x = 40 + i * gap;
    r += `<rect x="${x}" y="${170 - a[i] * 2.2}" width="${bw}" height="${a[i] * 2.2}" rx="6" fill="url(#ga)" style="animation-delay:${i * 70}ms"/>`;
    r += `<rect x="${x + bw + 4}" y="${170 - b[i] * 2.2}" width="${bw}" height="${b[i] * 2.2}" rx="6" fill="var(--accent2)" opacity=".55" style="animation-delay:${i * 70 + 40}ms"/>`;
    r += `<text x="${x + bw}" y="186" text-anchor="middle">${d}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".6"/></linearGradient></defs><g class="grid">${g}</g><g class="bars">${r}</g></svg>`;
}

function render(t) {
  const navItems = [["Dashboard", I.dash], ["Lead Submission", I.lead], ["Dupe Checker", I.dupe], ["Active Campaigns", I.camp, 7], ["Progress", I.prog], ["Tools", I.tool]];
  const nav = navItems.map((n, i) => `<a href="#" class="${i === 0 ? "on" : ""}"><svg viewBox="0 0 24 24">${n[1]}</svg>${n[0]}${n[2] ? `<span class="badge">${n[2]}</span>` : ""}</a>`).join("");
  const minis = [
    ["This week", 142, "+12%", I.prog, [8, 12, 9, 14, 13, 18, 22]],
    ["This month", 356, "+8%", I.users, [30, 28, 35, 33, 40, 44, 48]],
    ["Duplicates", 12, "-3", I.copy, [6, 5, 7, 4, 5, 3, 2]],
  ];
  const agents = [["Owais", 57, "🥇"], ["Shafqat", 51, "🥈"], ["Alishba", 42, "🥉"], ["Ali", 38, "4"], ["Faiz", 33, "5"]];
  const leads = [
    ["6:02 PM", "Valerie Beard", "Owais", "MED CPL (ADO)", "OH", "ok"],
    ["5:38 PM", "Jill Sammons", "Sufiyan", "FE 180 (ADO)", "SC", "ok"],
    ["4:35 PM", "Virgil Gainey", "Ali", "MED CPL (ADO)", "PA", "dup"],
    ["2:25 PM", "Mary Frasier", "Wasiq", "180 FE SYED", "GA", "ok"],
    ["1:10 PM", "Robert Lane", "Alishba", "FE 140 (ELIJ)", "TX", "ok"],
  ];
  document.getElementById("mount").innerHTML = `
  <div class="frame t${t}">
    <div class="fx"><i></i><i></i><i></i></div>
    <div class="app">
      <aside class="side">
        <div class="logo"><i>A</i><div>Your CRM<small>Call Center</small></div></div>
        <div class="navlbl">Menu</div>
        <nav class="nav">${nav}</nav>
        <div class="side-foot"><span class="dot"></span><div><b>Sheet connected</b><span>Synced 12s ago</span></div></div>
      </aside>
      <main class="content">
        <div class="top">
          <div><h1>Good evening, Owais 👋</h1><p>Tuesday, Sep 29 · 7:42 PM ET · Shift: 7 PM – 3 AM</p></div>
          <div class="search"><svg width="16" height="16" viewBox="0 0 24 24">${I.search}</svg>Search leads, phone…</div>
          <div class="iconbtn"><svg width="19" height="19" viewBox="0 0 24 24">${I.bell}</svg></div>
          <div class="avatar">OW</div>
        </div>

        <div class="row1">
          <div class="card hero" style="animation-delay:0ms">
            <div class="lbl">Today's leads</div>
            <div class="big" data-count="15">0</div>
            <div class="sub"><span class="chip up" style="background:rgba(255,255,255,.22);color:#fff">▲ 25%</span> vs yesterday</div>
            ${area([3, 5, 4, 8, 7, 11, 9, 13, 15])}
          </div>
          ${minis.map((m, i) => `
          <div class="card mini" style="animation-delay:${(i + 1) * 80}ms">
            <div class="ic" style="background:${ICON_COLORS[i + 1][0]};color:${ICON_COLORS[i + 1][1]}"><svg viewBox="0 0 24 24">${m[3]}</svg></div>
            <div class="n" data-count="${m[1]}">0</div>
            <div class="l">${m[0]} <span class="chip up">${m[2]}</span></div>
            ${spark(m[4], ICON_COLORS[i + 1][1])}
          </div>`).join("")}
        </div>

        <div class="row2">
          <div class="card" style="animation-delay:250ms">
            <h3>Leads this week <small><span class="legend"><span><i style="background:var(--accent)"></i>Submitted</span><span><i style="background:var(--accent2);opacity:.6"></i>Transferred</span></span></small></h3>
            ${bars()}
          </div>
          <div class="card" style="animation-delay:320ms">
            <h3>Top agents <small>this month</small></h3>
            <div class="agents">
              ${agents.map((a, i) => `<div class="agent"><span class="medal">${a[2]}</span><span class="av" style="background:${AV[i]}">${a[0].slice(0, 2).toUpperCase()}</span><div><b>${a[0]}</b><span>Agent · ${7 - i} campaigns</span></div><div class="score"><b data-count="${a[1]}">0</b><span> leads</span></div></div>`).join("")}
            </div>
          </div>
        </div>

        <div class="row3">
          <div class="card" style="animation-delay:400ms">
            <h3>Recent submissions <span class="chip live">Live</span><small>View all →</small></h3>
            <table>
              <thead><tr><th>Customer</th><th>Agent</th><th>Campaign</th><th>State</th><th>Time</th><th>Status</th></tr></thead>
              <tbody>${leads.map((r, i) => `<tr><td><span class="who"><i style="background:${AV[(i + 2) % 6]}">${r[1].split(" ").map(s => s[0]).join("")}</i>${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[0]}</td><td><span class="st ${r[5]}">${r[5] === "ok" ? "Submitted" : "Duplicate"}</span></td></tr>`).join("")}</tbody>
            </table>
          </div>
          <div class="card quick" style="animation-delay:470ms">
            <h3>Quick lead</h3>
            <div class="two"><label class="inp">First name<input placeholder="John"></label><label class="inp">Last name<input placeholder="Smith"></label></div>
            <div class="two"><label class="inp">Phone<input placeholder="(555) 555-5555"></label><label class="inp">DOB<input placeholder="MM/DD/YYYY"></label></div>
            <label class="inp">Campaign<select><option>MED CPL BLIND TRANSFERS (ADO)</option></select></label>
            <button class="btn">Submit lead</button>
            <h3 style="margin:10px 0 0">Dupe check</h3>
            <div class="dupebox inp"><input placeholder="(555) 555-5555"><button class="btn">Check</button></div>
            <span class="ok-msg">✓ New number — no prior submissions</span>
          </div>
        </div>
      </main>
    </div>
  </div>`;
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 1200); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString(); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  document.getElementById("desc").textContent = DESC[t];
  document.querySelectorAll("#picker button").forEach(b => b.classList.toggle("on", b.dataset.t == t));
  try { history.replaceState(null, "", "#" + t); } catch {}
}
document.getElementById("picker").addEventListener("click", e => { const b = e.target.closest("button"); if (b) render(b.dataset.t); });
render(Number(location.hash.slice(1)) || 1);
</script>
</body>
