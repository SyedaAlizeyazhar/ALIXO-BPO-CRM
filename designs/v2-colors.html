<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALIXO BPO · Colour Themes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: #0d0f14; }
  .picker { position: sticky; top: 0; z-index: 100; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 14px 20px; background: #0d0f14; color: #fff; border-bottom: 1px solid #1f2430; }
  .picker b { font-size: 14px; }
  .sw { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; transition: transform .2s; outline: 2px solid transparent; outline-offset: 2px; }
  .sw button:hover { transform: scale(1.12); }
  .sw button.on { outline-color: #fff; }
  .modebtn { margin-left: auto; font: 600 13px "Plus Jakarta Sans", sans-serif; border: 1px solid #2c3342; background: transparent; color: #fff; padding: 8px 16px; border-radius: 999px; cursor: pointer; }
  .picker .desc { flex-basis: 100%; font-size: 12.5px; color: #8b93a5; }
  .stage { padding: 22px 16px 60px; }

  /* ---------- base tokens by mode ---------- */
  .frame[data-m="dark"] { --bg: #0b0e1a; --text: #eef1ff; --muted: #8c93b3; --panel: rgba(255,255,255,.045); --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.05); --input-bg: rgba(255,255,255,.04); --side-bg: rgba(10,13,26,.55); --side-text: #a7aecb; --side-border: rgba(255,255,255,.06); --side-card: rgba(255,255,255,.05); --blob-o: .5; --up: #34d399; --up-bg: rgba(52,211,153,.14); --warn: #fbbf24; --warn-bg: rgba(251,191,36,.14); --card-shadow: none; }
  .frame[data-m="light"] { --bg: #f5f6fb; --text: #1b1d3a; --muted: #7b7f9e; --panel: #fff; --line: #eceef6; --hover: #f5f6fc; --input-bg: #f7f8fc; --side-bg: #fff; --side-text: #6b6f8e; --side-border: #eceef6; --side-card: #f5f6fb; --blob-o: .22; --up: #059669; --up-bg: #d1fae5; --warn: #d97706; --warn-bg: #fef3c7; --card-shadow: 0 4px 20px rgba(27,29,58,.05); }

  /* ---------- frame ---------- */
  .frame { position: relative; isolation: isolate; overflow: hidden; max-width: 1320px; margin: 0 auto; border-radius: 22px; background: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", sans-serif; box-shadow: 0 30px 80px rgba(0,0,0,.35); transition: background .5s, color .4s; }
  .fx { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .fx i { position: absolute; border-radius: 50%; filter: blur(80px); opacity: var(--blob-o); animation: drift 18s ease-in-out infinite alternate; transition: background .6s, opacity .5s; }
  .fx i:nth-child(1) { width: 480px; height: 480px; left: -120px; top: -140px; background: var(--accent); }
  .fx i:nth-child(2) { width: 420px; height: 420px; right: -100px; top: 140px; background: var(--accent2); animation-duration: 22s; }
  .fx i:nth-child(3) { width: 360px; height: 360px; left: 35%; bottom: -160px; background: var(--accent); animation-duration: 26s; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.15); } }
  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 900px; }

  .side { background: var(--side-bg); color: var(--side-text); padding: 24px 18px; display: flex; flex-direction: column; gap: 5px; border-right: 1px solid var(--side-border); backdrop-filter: blur(18px); transition: background .5s; }
  .logo { display: flex; align-items: center; gap: 11px; margin: 0 6px 28px; color: var(--text); }
  .logo svg { width: 40px; height: 40px; flex: none; }
  .logo b { display: block; font-family: Outfit, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: .04em; line-height: 1; }
  .logo b span { font-weight: 500; opacity: .7; }
  .logo small { display: block; font-size: 8.5px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin-top: 5px; white-space: nowrap; }
  .navlbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin: 6px 12px 6px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; color: inherit; text-decoration: none; transition: background .25s, color .25s, transform .25s; }
  .nav a svg { width: 19px; height: 19px; flex: none; }
  .nav a:hover { background: var(--hover); transform: translateX(3px); }
  .nav a.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 700; box-shadow: 0 10px 22px var(--glow); }
  .nav a .badge { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff; }
  .nav a.on .badge { background: rgba(255,255,255,.25); }
  .side-foot { margin-top: auto; padding: 14px; border-radius: 16px; background: var(--side-card); display: flex; align-items: center; gap: 12px; }
  .side-foot .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.2); animation: pulse 2s infinite; }
  .side-foot b { display: block; font-size: 13px; color: var(--text); }
  .side-foot span { font-size: 12px; opacity: .7; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } }

  .content { padding: 26px 32px 40px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .top h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .top p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 13px; min-width: 220px; }
  .ib { position: relative; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--text); cursor: pointer; }
  .ib svg { width: 19px; height: 19px; }
  .ib.dot::after { content: ""; position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); }
  .theme .sun { display: none; } [data-m="dark"] .theme .sun { display: block; } [data-m="dark"] .theme .moon { display: none; }
  .pal { position: relative; }
  .pal-pop { position: absolute; right: 0; top: 50px; z-index: 5; display: none; grid-template-columns: repeat(4, 30px); gap: 8px; padding: 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,.25); }
  .pal.open .pal-pop { display: grid; }
  .pal-pop button { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; outline: 2px solid transparent; outline-offset: 2px; }
  .pal-pop button.on { outline-color: var(--text); }
  .avatar { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--card-shadow); backdrop-filter: blur(16px); transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, background .5s, border-color .5s; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; min-width: 0; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 18px 44px var(--glow); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .card h3 { margin: 0 0 16px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .card h3 small { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--up-bg); color: var(--up); }
  .chip.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .row1 { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: 0; min-height: 190px; transition: background .6s; }
  .hero .lbl { font-size: 13px; opacity: .9; }
  .hero .big { font-size: 46px; font-weight: 800; letter-spacing: -.03em; margin: 6px 0 2px; }
  .hero .sub { font-size: 12.5px; opacity: .9; }
  .hero .chip { background: rgba(255,255,255,.22); color: #fff; }
  .hero svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 55%; }
  .hero .area { fill: rgba(255,255,255,.18); }
  .hero .ln { fill: none; stroke: #fff; stroke-width: 2.5; stroke-dasharray: 800; stroke-dashoffset: 800; animation: draw 2s .3s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .mini .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px; background: var(--soft); color: var(--accent); }
  .mini .ic svg { width: 20px; height: 20px; }
  .mini .n { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .mini .l { font-size: 13px; color: var(--muted); margin: 2px 0 10px; display: flex; gap: 8px; align-items: center; }
  .spark { width: 100%; height: 34px; }
  .spark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.6s .5s ease forwards; }

  .row2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; margin-bottom: 18px; }
  .chart { width: 100%; height: 210px; }
  .chart line { stroke: var(--line); }
  .chart rect { transform-origin: bottom; transform-box: fill-box; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; transition: fill .5s; }
  @keyframes grow { from { transform: scaleY(0); } }
  .chart text { font-size: 10px; fill: var(--muted); }
  .agents { display: flex; flex-direction: column; gap: 10px; }
  .agent { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; }
  .agent:hover { background: var(--hover); }
  .agent .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; }
  .agent b { display: block; font-size: 14px; }
  .agent span { font-size: 12px; color: var(--muted); }
  .agent .score { margin-left: auto; text-align: right; }
  .agent .score b { font-size: 16px; }
  .medal { font-size: 18px; width: 22px; text-align: center; }

  .row3 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; }
  .row3 > .card:first-child { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 0 10px 12px; }
  td { padding: 12px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
  tbody tr:hover { background: var(--hover); }
  td .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  td .who i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #fff; }
  .st { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .st.ok { background: var(--up-bg); color: var(--up); }
  .st.dup { background: var(--warn-bg); color: var(--warn); }
  .quick { display: flex; flex-direction: column; gap: 12px; }
  .inp { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .inp input, .inp select { font: 500 14px "Plus Jakarta Sans", sans-serif; color: var(--text); background: var(--input-bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .inp input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { font: 700 14px "Plus Jakarta Sans", sans-serif; color: #fff; border: 0; border-radius: 12px; padding: 13px 18px; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 10px 24px var(--glow); transition: transform .2s; }
  .btn:hover { transform: translateY(-2px); }
  .dupebox { display: flex; gap: 10px; }
  .dupebox input { flex: 1; }
  .ok-msg { font-size: 12.5px; color: var(--up); font-weight: 600; }

  @media (max-width: 1100px) { .row1 { grid-template-columns: 1fr 1fr; } .row2, .row3 { grid-template-columns: 1fr; } }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .side { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .logo { margin: 0 12px 0 0; }
    .nav { display: flex; flex-wrap: wrap; gap: 4px; }
    .navlbl, .side-foot, .search { display: none; }
    .content { padding: 20px 16px; }
    .row1 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="picker">
    <b>Colour:</b>
    <div class="sw" id="sw"></div>
    <button class="modebtn" id="modeBtn">☀️ Light mode</button>
    <span class="desc" id="desc"></span>
  </div>
  <div class="stage"><div id="mount"></div></div>

<script>
/* accent, accent2, name — the rest of each theme is derived from these. */
const PALETTES = [
  ["#6366f1", "#22d3ee", "Aurora — indigo + cyan"],
  ["#7c3aed", "#ec4899", "Grape — purple + pink"],
  ["#2563eb", "#06b6d4", "Ocean — blue + aqua"],
  ["#10b981", "#84cc16", "Emerald — green + lime"],
  ["#0d9488", "#14b8a6", "Teal — calm teal"],
  ["#f97316", "#ec4899", "Sunset — orange + pink"],
  ["#e11d48", "#f59e0b", "Rose Gold — rose + gold"],
  ["#334155", "#64748b", "Graphite — slate grey (sab se saada)"],
];
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

const I = {
  dash: '<path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z" fill="currentColor"/>',
  lead: '<path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5z" fill="currentColor"/>',
  dupe: '<path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 10-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z" fill="currentColor"/>',
  camp: '<path d="M3 11l18-7-7 18-2.5-7.5z" fill="currentColor"/>',
  call: '<path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.6 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.4 11.4 0 00.6 3.6 1 1 0 01-.25 1z" fill="currentColor"/>',
  prog: '<path d="M5 21V9h3v12zm7 0V3h3v18zm7 0v-7h3v7z" fill="currentColor"/>',
  tool: '<path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.7 4.7C.6 7.1 1 10.1 3 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1 0-1.4z" fill="currentColor"/>',
  users: '<path d="M16 11a3 3 0 100-6 3 3 0 000 6zm-8 0a3 3 0 100-6 3 3 0 000 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z" fill="currentColor"/>',
  copy: '<path d="M16 1H4a2 2 0 00-2 2v14h2V3h12zm3 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11z" fill="currentColor"/>',
  search: '<path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 10-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z" fill="currentColor"/>',
  bell: '<path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11a6 6 0 00-5-5.9V4a1 1 0 10-2 0v1.1A6 6 0 006 11v5l-2 2v1h16v-1z" fill="currentColor"/>',
  sun: '<circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>',
  moon: '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="currentColor"/>',
  palette: '<path d="M12 3a9 9 0 000 18c.8 0 1.5-.7 1.5-1.5 0-.4-.1-.7-.4-1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16a5 5 0 005-5c0-4.4-4-8-9-8zm-5.5 9a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3-4a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 4a1.5 1.5 0 110-3 1.5 1.5 0 010 3z" fill="currentColor"/>'
};
const AV = ["#6366f1", "#06b6d4", "#f59e0b", "#ec4899", "#10b981", "#8b5cf6"];

const mark = `<svg viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient></defs>
  <path d="M46,7.3a8,8 0 0 1 8,0l31,17.9a8,8 0 0 1 4,6.9v35.8a8,8 0 0 1-4,6.9l-31,17.9a8,8 0 0 1-8,0l-31-17.9a8,8 0 0 1-4-6.9V32.1a8,8 0 0 1 4-6.9z" fill="none" stroke="url(#lg)" stroke-width="7"/>
  <g fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M29,70 L48,30"/><path d="M36.5,56 L48,56"/><path d="M50,29 V71"/><path d="M50,30 H60 a10,10 0 0 1 0,20 H50 M50,50 H63 a10,10 0 0 1 0,20 H50"/></g></svg>`;

function spark(pts) {
  const w = 200, h = 34, max = Math.max(...pts), min = Math.min(...pts);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${pts.map((p, i) => `${i ? "L" : "M"}${(i / (pts.length - 1)) * w},${h - 4 - ((p - min) / (max - min || 1)) * (h - 8)}`).join(" ")}"/></svg>`;
}
function area(pts) {
  const w = 400, h = 120, max = Math.max(...pts);
  const xy = pts.map((p, i) => [(i / (pts.length - 1)) * w, h - (p / max) * (h - 16)]);
  let d = `M${xy[0]}`;
  for (let i = 1; i < xy.length; i++) { const cx = (xy[i - 1][0] + xy[i][0]) / 2; d += ` C${cx},${xy[i - 1][1]} ${cx},${xy[i][1]} ${xy[i]}`; }
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="area" d="${d} L${w},${h} L0,${h}Z"/><path class="ln" d="${d}"/></svg>`;
}
function bars() {
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], a = [42, 55, 38, 61, 70, 48, 35], b = [30, 41, 29, 44, 52, 33, 22];
  const W = 520, gap = W / 7;
  let s = "";
  for (let i = 0; i < 5; i++) s += `<line x1="30" x2="${W}" y1="${10 + i * 40}" y2="${10 + i * 40}"/>`;
  days.forEach((d, i) => {
    const x = 40 + i * gap;
    s += `<rect x="${x}" y="${170 - a[i] * 2.2}" width="18" height="${a[i] * 2.2}" rx="6" style="fill:var(--accent);animation-delay:${i * 70}ms"/>`;
    s += `<rect x="${x + 22}" y="${170 - b[i] * 2.2}" width="18" height="${b[i] * 2.2}" rx="6" style="fill:var(--accent2);opacity:.55;animation-delay:${i * 70 + 40}ms"/>`;
    s += `<text x="${x + 20}" y="188" text-anchor="middle">${d}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} 196">${s}</svg>`;
}

let P = 0, M = "dark";

function applyTheme() {
  const f = document.querySelector(".frame");
  const [a, b, name] = PALETTES[P];
  f.dataset.m = M;
  f.style.setProperty("--accent", a);
  f.style.setProperty("--accent2", b);
  f.style.setProperty("--glow", hexA(a, M === "dark" ? .35 : .22));
  f.style.setProperty("--soft", hexA(a, M === "dark" ? .16 : .1));
  document.getElementById("desc").textContent = `${name} · ${M === "dark" ? "Dark" : "Light"} mode — agent CRM mein 🎨 button se khud bhi rang chun sakega.`;
  document.getElementById("modeBtn").textContent = M === "dark" ? "☀️ Light mode" : "🌙 Dark mode";
  document.querySelectorAll("[data-p]").forEach(b => b.classList.toggle("on", +b.dataset.p === P));
}

function render() {
  const navItems = [["Dashboard", I.dash], ["Lead Submission", I.lead], ["Dupe Checker", I.dupe], ["Active Campaigns", I.camp, 7], ["Callbacks", I.call], ["Progress", I.prog], ["Tools", I.tool]];
  const minis = [["This week", 142, "+12%", I.prog, [8, 12, 9, 14, 13, 18, 22]], ["This month", 356, "+8%", I.users, [30, 28, 35, 33, 40, 44, 48]], ["Duplicates", 12, "-3", I.copy, [6, 5, 7, 4, 5, 3, 2]]];
  const agents = [["Owais", 57, "🥇"], ["Shafqat", 51, "🥈"], ["Alishba", 42, "🥉"], ["Ali", 38, "4"], ["Faiz", 33, "5"]];
  const leads = [["6:02 PM", "Valerie Beard", "Owais", "MED CPL (ADO)", "OH", "ok"], ["5:38 PM", "Jill Sammons", "Sufiyan", "FE 180 (ADO)", "SC", "ok"], ["4:35 PM", "Virgil Gainey", "Ali", "MED CPL (ADO)", "PA", "dup"], ["2:25 PM", "Mary Frasier", "Wasiq", "180 FE SYED", "GA", "ok"], ["1:10 PM", "Robert Lane", "Alishba", "FE 140 (ELIJ)", "TX", "ok"]];
  const swatch = (p, i) => `<button data-p="${i}" title="${p[2]}" style="background:linear-gradient(135deg,${p[0]},${p[1]})"></button>`;

  document.getElementById("sw").innerHTML = PALETTES.map(swatch).join("");
  document.getElementById("mount").innerHTML = `
  <div class="frame" data-m="${M}">
    <div class="fx"><i></i><i></i><i></i></div>
    <div class="app">
      <aside class="side">
        <div class="logo">${mark}<div><b>ALIXO <span>BPO</span></b><small>Let's grow together</small></div></div>
        <div class="navlbl">Menu</div>
        <nav class="nav">${navItems.map((n, i) => `<a href="#" class="${i === 0 ? "on" : ""}"><svg viewBox="0 0 24 24">${n[1]}</svg>${n[0]}${n[2] ? `<span class="badge">${n[2]}</span>` : ""}</a>`).join("")}</nav>
        <div class="side-foot"><span class="dot"></span><div><b>Sheet connected</b><span>Synced 12s ago</span></div></div>
      </aside>
      <main class="content">
        <div class="top">
          <div><h1>Good evening, Owais 👋</h1><p>Tuesday, Sep 29 · 7:42 PM ET · Shift 7 PM – 3 AM</p></div>
          <div class="search"><svg width="16" height="16" viewBox="0 0 24 24">${I.search}</svg>Search leads, phone…</div>
          <div class="pal"><button class="ib" id="palBtn" title="Colour theme"><svg viewBox="0 0 24 24">${I.palette}</svg></button><div class="pal-pop">${PALETTES.map(swatch).join("")}</div></div>
          <button class="ib theme" id="themeBtn" title="Light / dark"><svg class="moon" viewBox="0 0 24 24">${I.moon}</svg><svg class="sun" viewBox="0 0 24 24">${I.sun}</svg></button>
          <span class="ib dot"><svg viewBox="0 0 24 24">${I.bell}</svg></span>
          <span class="avatar">OW</span>
        </div>

        <div class="row1">
          <div class="card hero"><div class="lbl">Today's leads</div><div class="big" data-count="15">0</div><div class="sub"><span class="chip">▲ 25%</span> vs yesterday</div>${area([3, 5, 4, 8, 7, 11, 9, 13, 15])}</div>
          ${minis.map((m, i) => `<div class="card mini" style="animation-delay:${(i + 1) * 80}ms"><div class="ic"><svg viewBox="0 0 24 24">${m[3]}</svg></div><div class="n" data-count="${m[1]}">0</div><div class="l">${m[0]} <span class="chip">${m[2]}</span></div>${spark(m[4])}</div>`).join("")}
        </div>

        <div class="row2">
          <div class="card" style="animation-delay:250ms"><h3>Leads this week <small>Submitted · Transferred</small></h3>${bars()}</div>
          <div class="card" style="animation-delay:320ms"><h3>Top agents <small>this month</small></h3>
            <div class="agents">${agents.map((a, i) => `<div class="agent"><span class="medal">${a[2]}</span><span class="av" style="background:${AV[i]}">${a[0].slice(0, 2).toUpperCase()}</span><div><b>${a[0]}</b><span>Agent · ${7 - i} campaigns</span></div><div class="score"><b data-count="${a[1]}">0</b><span> leads</span></div></div>`).join("")}</div>
          </div>
        </div>

        <div class="row3">
          <div class="card" style="animation-delay:400ms"><h3>Recent submissions <span class="chip live">Live</span><small>View all →</small></h3>
            <table><thead><tr><th>Customer</th><th>Agent</th><th>Campaign</th><th>State</th><th>Time</th><th>Status</th></tr></thead>
            <tbody>${leads.map((r, i) => `<tr><td><span class="who"><i style="background:${AV[(i + 2) % 6]}">${r[1].split(" ").map(s => s[0]).join("")}</i>${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[0]}</td><td><span class="st ${r[5]}">${r[5] === "ok" ? "Submitted" : "Duplicate"}</span></td></tr>`).join("")}</tbody></table>
          </div>
          <div class="card quick" style="animation-delay:470ms"><h3>Quick lead</h3>
            <div class="two"><label class="inp">First name<input placeholder="John"></label><label class="inp">Last name<input placeholder="Smith"></label></div>
            <div class="two"><label class="inp">Phone<input placeholder="(555) 555-5555"></label><label class="inp">DOB<input placeholder="MM/DD/YYYY"></label></div>
            <label class="inp">Campaign<select><option>MED CPL BLIND TRANSFERS (ADO)</option></select></label>
            <button class="btn">Submit lead</button>
            <h3 style="margin:10px 0 0">Dupe check</h3>
            <div class="dupebox inp"><input placeholder="(555) 555-5555"><button class="btn">Check</button></div>
            <span class="ok-msg">✓ New number — no prior submissions</span>
          </div>
        </div>
      </main>
    </div>
  </div>`;

  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 1200); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString(); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  document.getElementById("themeBtn").onclick = () => { M = M === "dark" ? "light" : "dark"; applyTheme(); };
  document.getElementById("palBtn").onclick = e => { e.stopPropagation(); document.querySelector(".pal").classList.toggle("open"); };
  applyTheme();
}

document.addEventListener("click", e => {
  const s = e.target.closest("[data-p]");
  if (s) { P = +s.dataset.p; applyTheme(); document.querySelector(".pal")?.classList.remove("open"); return; }
  if (!e.target.closest(".pal")) document.querySelector(".pal")?.classList.remove("open");
});
document.getElementById("modeBtn").onclick = () => { M = M === "dark" ? "light" : "dark"; applyTheme(); };
render();
</script>
</body>
</html>
