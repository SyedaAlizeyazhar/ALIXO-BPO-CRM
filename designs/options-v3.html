<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALIXO BPO · Designs v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Plus Jakarta Sans", sans-serif; background: #0d0f14; }
  .picker { position: sticky; top: 0; z-index: 100; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 14px 20px; background: #0d0f14; color: #fff; border-bottom: 1px solid #1f2430; }
  .picker b { margin-right: 10px; font-size: 14px; }
  .picker button { font: 500 13px "Plus Jakarta Sans", sans-serif; border: 1px solid #2c3342; background: transparent; color: #c6cbd6; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: .2s; }
  .picker button:hover { border-color: #5b6477; color: #fff; }
  .picker button.on { background: #fff; color: #111; border-color: #fff; }
  .picker .mode { margin-left: auto; }
  .picker .desc { flex-basis: 100%; font-size: 12.5px; color: #8b93a5; margin-top: 4px; }
  .stage { padding: 22px 16px 60px; }

  /* ================= frame + tokens ================= */
  .frame { position: relative; isolation: isolate; overflow: hidden; max-width: 1340px; margin: 0 auto; border-radius: 24px; background: var(--bg); color: var(--text); font-family: var(--font); box-shadow: 0 30px 80px rgba(0,0,0,.35); transition: background .5s, color .5s; }
  .frame * { transition: background-color .5s, border-color .5s, color .3s; }
  .fx { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .fx i { position: absolute; border-radius: 50%; filter: blur(80px); opacity: var(--blob-o, .45); animation: drift 20s ease-in-out infinite alternate; }
  .fx i:nth-child(1) { width: 520px; height: 520px; left: -160px; top: -180px; background: var(--accent); }
  .fx i:nth-child(2) { width: 440px; height: 440px; right: -140px; top: 220px; background: var(--accent2); animation-duration: 26s; }
  @keyframes drift { to { transform: translate(70px, 50px) scale(1.12); } }

  .shell { display: grid; grid-template-columns: 250px 1fr; min-height: 940px; }
  .main { padding: 24px 30px 40px; min-width: 0; }

  /* logo */
  .logo { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--text); }
  .logo svg { width: 40px; height: 40px; flex: none; }
  .logo b { display: block; font-family: Outfit, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: .04em; line-height: 1; }
  .logo b span { font-weight: 500; opacity: .7; }
  .logo small { display: block; font-size: 8.5px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin-top: 5px; white-space: nowrap; }

  /* sidebar */
  .side { background: var(--side-bg); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; backdrop-filter: blur(18px); }
  .side .logo { margin: 0 8px 28px; }
  .navlbl { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 14px 12px 6px; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; transition: .25s; }
  .nav a svg { width: 19px; height: 19px; flex: none; }
  .nav a:hover { background: var(--hover); color: var(--text); }
  .nav a.on { background: var(--active-bg); color: var(--active-text); font-weight: 700; box-shadow: var(--active-shadow, none); }
  .nav a .badge { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff; }
  .me { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
  .me b { display: block; font-size: 13.5px; }
  .me span { font-size: 11.5px; color: var(--muted); }

  /* topbar */
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .topbar h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .topbar p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 13px; min-width: 230px; }
  .ib { position: relative; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--text); cursor: pointer; }
  .ib svg { width: 19px; height: 19px; }
  .ib.dot::after { content: ""; position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); }
  .theme-btn .sun { display: none; } [data-m="dark"] .theme-btn .sun { display: block; } [data-m="dark"] .theme-btn .moon { display: none; }
  .theme-btn:hover svg { transform: rotate(30deg); transition: transform .4s; }
  .av { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); flex: none; }

  /* grid of tiles */
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-areas:
      "hero hero s1 s2"
      "hero hero s3 cb"
      "chart chart agents agents"
      "table table table quick"; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r, 20px); padding: 20px; box-shadow: var(--shadow, none); backdrop-filter: blur(16px); min-width: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, background-color .5s, border-color .5s; }
  .tile:hover { transform: translateY(-4px); box-shadow: var(--shadow-h, 0 18px 40px rgba(0,0,0,.14)); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .tile h3 { margin: 0 0 14px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .tile h3 small { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
  .hero { grid-area: hero; position: relative; overflow: hidden; background: var(--hero); color: #fff; border: 0; display: flex; flex-direction: column; justify-content: space-between; min-height: 290px; }
  .s1 { grid-area: s1; } .s2 { grid-area: s2; } .s3 { grid-area: s3; } .cb { grid-area: cb; } .chart { grid-area: chart; } .agents { grid-area: agents; } .table { grid-area: table; } .quick { grid-area: quick; }

  .hero .hi { font-size: 13px; opacity: .85; }
  .hero .big { font-size: 60px; font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 8px 0 6px; }
  .hero .sub { font-size: 13px; opacity: .85; }
  .hero .goal { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
  .hero .goal svg { width: 84px; height: 84px; transform: rotate(-90deg); }
  .hero .goal circle { fill: none; stroke-width: 9; }
  .hero .goal .t { stroke: rgba(255,255,255,.2); }
  .hero .goal .v { stroke: #fff; stroke-linecap: round; stroke-dasharray: 226; stroke-dashoffset: 226; animation: ring 1.8s .3s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes ring { to { stroke-dashoffset: var(--off); } }
  .hero .goal b { display: block; font-size: 15px; }
  .hero .goal span { font-size: 12px; opacity: .8; }
  .hero .wave { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; width: 100%; opacity: .9; }
  .hero .wave path { fill: rgba(255,255,255,.14); }
  .hero .wave .ln { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 2.5; stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2s .4s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--up-bg); color: var(--up); }
  .hero .chip { background: rgba(255,255,255,.2); color: #fff; }
  .chip.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  .stat .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 12px; background: var(--ic-bg); color: var(--accent); }
  .stat .ic svg { width: 20px; height: 20px; }
  .stat .n { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .stat .l { font-size: 13px; color: var(--muted); margin: 2px 0 8px; display: flex; gap: 8px; align-items: center; }
  .spark { width: 100%; height: 30px; }
  .spark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.6s .5s ease forwards; }

  .cb { display: flex; flex-direction: column; background: var(--cb-bg, var(--panel)); }
  .cb .ic { background: var(--up-bg); color: var(--up); }
  .cb p { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .cb a { margin-top: auto; font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; }

  .bars { width: 100%; height: 200px; }
  .bars line { stroke: var(--line); }
  .bars rect { transform-origin: bottom; transform-box: fill-box; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleY(0); } }
  .bars text { font-size: 10px; fill: var(--muted); font-family: var(--font); }

  .ag { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; }
  .ag:hover { background: var(--hover); }
  .ag .p { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; flex: none; }
  .ag b { display: block; font-size: 14px; }
  .ag span { font-size: 12px; color: var(--muted); }
  .ag .sc { margin-left: auto; text-align: right; }
  .ag .bar { height: 5px; border-radius: 5px; background: var(--hover); margin-top: 5px; width: 90px; overflow: hidden; }
  .ag .bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); animation: fill 1.2s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fill { from { width: 0 !important; } }
  .medal { width: 22px; text-align: center; font-size: 17px; }

  .table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 10px 12px; }
  td { padding: 12px 10px; border-top: 1px solid var(--line); white-space: nowrap; }
  tbody tr:hover { background: var(--hover); }
  td .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  td .who i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #fff; }
  .st { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .st.ok { background: var(--up-bg); color: var(--up); }
  .st.dup { background: var(--warn-bg); color: var(--warn); }

  .quick { display: flex; flex-direction: column; gap: 10px; }
  .inp { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .inp input, .inp select { font: 500 14px var(--font); color: var(--text); background: var(--input); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; outline: none; }
  .inp input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  .btn { font: 700 14px var(--font); color: #fff; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 10px 24px var(--glow); transition: transform .2s; }
  .btn:hover { transform: translateY(-2px); }

  /* ================= top-nav layouts (d1, d5) ================= */
  .topnav { display: flex; align-items: center; gap: 22px; padding: 18px 30px; border-bottom: 1px solid var(--line); background: var(--side-bg); backdrop-filter: blur(18px); }
  .topnav .nav { display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: var(--hover); }
  .topnav .nav a { padding: 9px 12px; font-size: 13px; white-space: nowrap; }
  .topnav .nav a .badge { margin-left: 6px; }
  .topnav .search { display: none; }
  .topnav .nav a svg { display: none; }
  .topnav .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

  /* ================= 1. NOVA — top nav, indigo/cyan ================= */
  .d1 { --font: "Plus Jakarta Sans", sans-serif; --r: 22px; }
  .d1[data-m="dark"] { --bg: #0a0d1a; --text: #eef1ff; --muted: #8c93b3; --panel: rgba(255,255,255,.045); --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.06); --input: rgba(255,255,255,.04); --side-bg: rgba(10,13,26,.6); --active-bg: #fff; --active-text: #0a0d1a; --ic-bg: rgba(99,102,241,.16); --blob-o: .4; }
  .d1[data-m="light"] { --bg: #f4f6fc; --text: #141733; --muted: #6f7597; --panel: #fff; --line: #e8eaf4; --hover: #f1f2fa; --input: #f6f7fc; --side-bg: rgba(255,255,255,.8); --active-bg: #141733; --active-text: #fff; --ic-bg: #eef0ff; --blob-o: .18; --shadow: 0 4px 18px rgba(20,23,51,.05); }
  .d1 { --accent: #6366f1; --accent2: #22d3ee; --glow: rgba(99,102,241,.3); --hero: linear-gradient(135deg, #4f46e5, #0ea5e9); --up: #10b981; --up-bg: rgba(16,185,129,.14); --warn: #f59e0b; --warn-bg: rgba(245,158,11,.14); }
  .d1 .shell, .d5 .shell { grid-template-columns: 1fr; }

  /* ================= 2. BENTO — floating sidebar, violet/lime ================= */
  .d2 { --font: "Outfit", sans-serif; --r: 28px; --accent: #8b5cf6; --accent2: #f472b6; --glow: rgba(139,92,246,.3); --hero: linear-gradient(135deg, #8b5cf6, #ec4899); --up: #16a34a; --up-bg: rgba(22,163,74,.13); --warn: #ea580c; --warn-bg: rgba(234,88,12,.13); }
  .d2[data-m="dark"] { --bg: #111016; --text: #f4f1fb; --muted: #9a93ad; --panel: #1b1922; --line: #262330; --hover: #242130; --input: #15131b; --side-bg: #1b1922; --active-bg: #8b5cf6; --active-text: #fff; --ic-bg: rgba(139,92,246,.18); --blob-o: .15; }
  .d2[data-m="light"] { --bg: #f3f0f9; --text: #1d1530; --muted: #7a7091; --panel: #fff; --line: #ebe6f5; --hover: #f5f1fc; --input: #f8f6fc; --side-bg: #fff; --active-bg: #1d1530; --active-text: #fff; --ic-bg: #f1ebff; --blob-o: .12; --shadow: 0 6px 24px rgba(29,21,48,.05); }
  .d2 .shell { grid-template-columns: 260px 1fr; padding: 14px; gap: 6px; }
  .d2 .side { border: 1px solid var(--line); border-radius: 28px; }
  .d2 .grid { grid-template-areas:
      "hero hero hero s1"
      "s2 s3 cb cb"
      "chart chart chart agents"
      "table table quick quick"; }
  .d2 .cb { --cb-bg: linear-gradient(135deg, rgba(139,92,246,.14), rgba(244,114,182,.12)); }

  /* ================= 3. SLATE — icon rail, dense, emerald ================= */
  .d3 { --font: "Sora", sans-serif; --r: 14px; --accent: #10b981; --accent2: #06b6d4; --glow: rgba(16,185,129,.28); --hero: linear-gradient(135deg, #059669, #0891b2); --up: #10b981; --up-bg: rgba(16,185,129,.14); --warn: #f59e0b; --warn-bg: rgba(245,158,11,.14); }
  .d3[data-m="dark"] { --bg: #0c1117; --text: #e6edf3; --muted: #7d8a99; --panel: #121a22; --line: #1e2933; --hover: #17212b; --input: #0e151c; --side-bg: #0a0f14; --active-bg: rgba(16,185,129,.15); --active-text: #34d399; --ic-bg: rgba(16,185,129,.14); --blob-o: 0; }
  .d3[data-m="light"] { --bg: #f5f7f9; --text: #101820; --muted: #66727f; --panel: #fff; --line: #e4e8ec; --hover: #f0f3f5; --input: #f5f7f9; --side-bg: #fff; --active-bg: #e7f8f1; --active-text: #059669; --ic-bg: #e7f8f1; --blob-o: 0; }
  .d3 .shell { grid-template-columns: 78px 1fr; }
  .d3 .side { align-items: center; padding: 20px 10px; }
  .d3 .side .logo { margin: 0 0 24px; }
  .d3 .side .logo div, .d3 .navlbl, .d3 .nav a span.t, .d3 .nav a .badge, .d3 .me div { display: none; }
  .d3 .nav a { width: 48px; height: 48px; padding: 0; justify-content: center; }
  .d3 .me { padding: 8px; border: 0; background: transparent; }
  .d3 .grid { gap: 14px; }

  /* ================= 4. OCEAN — sidebar + wave header, blue ================= */
  .d4 { --font: "Manrope", sans-serif; --r: 20px; --accent: #2563eb; --accent2: #06b6d4; --glow: rgba(37,99,235,.3); --hero: linear-gradient(135deg, #1d4ed8, #0891b2); --up: #059669; --up-bg: rgba(5,150,105,.13); --warn: #d97706; --warn-bg: rgba(217,119,6,.13); }
  .d4[data-m="dark"] { --bg: #081221; --text: #e7eefa; --muted: #8397b4; --panel: rgba(18,32,56,.75); --line: rgba(120,160,220,.14); --hover: rgba(120,160,220,.08); --input: rgba(8,18,33,.6); --side-bg: #0a1628; --active-bg: linear-gradient(90deg, rgba(37,99,235,.35), rgba(6,182,212,.1)); --active-text: #fff; --active-shadow: inset 3px 0 0 #38bdf8; --ic-bg: rgba(37,99,235,.18); --blob-o: .25; }
  .d4[data-m="light"] { --bg: #eef4fb; --text: #0c1b33; --muted: #62748f; --panel: #fff; --line: #dfe8f3; --hover: #f1f6fc; --input: #f5f8fc; --side-bg: #0c1b33; --active-bg: rgba(255,255,255,.12); --active-text: #fff; --active-shadow: inset 3px 0 0 #38bdf8; --ic-bg: #e8f0fe; --blob-o: .15; --shadow: 0 6px 20px rgba(12,27,51,.05); }
  .d4[data-m="light"] .side { color: #fff; --muted: #9fb2cf; --text: #fff; --hover: rgba(255,255,255,.08); --panel: rgba(255,255,255,.06); --line: rgba(255,255,255,.1); }
  .d4 .main { position: relative; }
  .d4 .main::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 250px; z-index: -1; background: linear-gradient(135deg, #1d4ed8, #0891b2); opacity: var(--head-o, .9); -webkit-mask: linear-gradient(#000 70%, transparent); mask: linear-gradient(#000 70%, transparent); }
  .d4[data-m="light"] { --head-o: 1; }
  .d4 .topbar h1, .d4 .topbar p { color: #fff; }
  .d4 .topbar p { opacity: .8; }
  .d4 .search, .d4 .ib { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.2); color: #fff; }
  .d4 .hero { --hero: linear-gradient(135deg, #0c1b33, #1e3a8a); }

  /* ================= 5. ROSE — top nav, elegant serif numbers ================= */
  .d5 { --font: "Manrope", sans-serif; --r: 20px; --accent: #e11d48; --accent2: #f59e0b; --glow: rgba(225,29,72,.25); --hero: linear-gradient(135deg, #be123c, #f59e0b); --up: #059669; --up-bg: rgba(5,150,105,.12); --warn: #d97706; --warn-bg: rgba(217,119,6,.13); }
  .d5[data-m="dark"] { --bg: #140d10; --text: #fbeff2; --muted: #b0949c; --panel: rgba(255,255,255,.04); --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.05); --input: rgba(255,255,255,.03); --side-bg: rgba(20,13,16,.7); --active-bg: linear-gradient(135deg, #e11d48, #f59e0b); --active-text: #fff; --ic-bg: rgba(225,29,72,.15); --blob-o: .22; }
  .d5[data-m="light"] { --bg: #fdf7f4; --text: #2b1a1f; --muted: #8f747c; --panel: #fff; --line: #f1e4df; --hover: #fbf1ed; --input: #fcf6f3; --side-bg: rgba(255,255,255,.85); --active-bg: linear-gradient(135deg, #e11d48, #f59e0b); --active-text: #fff; --ic-bg: #fdecef; --blob-o: .14; --shadow: 0 6px 22px rgba(43,26,31,.05); }
  .d5 .hero .big, .d5 .stat .n, .d5 .topbar h1 { font-family: "Playfair Display", serif; letter-spacing: 0; }
  .d5 .topnav .nav { background: transparent; }
  .d5 .topnav .nav a { border-radius: 999px; }
  .d5 .grid { grid-template-areas:
      "hero hero hero hero"
      "s1 s2 s3 cb"
      "chart chart agents agents"
      "table table table quick"; }
  .d5 .hero { min-height: 220px; flex-direction: row; align-items: center; }

  @media (max-width: 1100px) {
    .grid, .d2 .grid, .d5 .grid { grid-template-columns: 1fr 1fr; grid-template-areas: "hero hero" "s1 s2" "s3 cb" "chart chart" "agents agents" "table table" "quick quick"; }
    .topnav { flex-wrap: wrap; }
  }
  @media (max-width: 760px) {
    .shell, .d2 .shell, .d3 .shell { grid-template-columns: 1fr; padding: 0; }
    .side { flex-direction: row; flex-wrap: wrap; align-items: center; border-radius: 0 !important; }
    .side .logo { margin: 0 12px 0 0; }
    .nav { display: flex; flex-wrap: wrap; gap: 4px; }
    .navlbl, .me, .search { display: none; }
    .main { padding: 18px 14px; }
    .grid, .d2 .grid, .d5 .grid { grid-template-columns: 1fr; grid-template-areas: "hero" "s1" "s2" "s3" "cb" "chart" "agents" "table" "quick"; }
    .d5 .hero { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
  <div class="picker" id="picker">
    <b>ALIXO BPO · designs v3:</b>
    <button data-d="1" class="on">1 · Nova</button>
    <button data-d="2">2 · Bento</button>
    <button data-d="3">3 · Slate</button>
    <button data-d="4">4 · Ocean</button>
    <button data-d="5">5 · Rose</button>
    <button class="mode" id="modeBtn">🌙 Dark</button>
    <span class="desc" id="desc"></span>
  </div>
  <div class="stage"><div id="mount"></div></div>

<script>
const DESC = {
  1: "Upar menu bar (sidebar nahi), bara hero card jis mein aaj ka target ring hai. Indigo + cyan. Screen ki poori chaurai content ko milti hai.",
  2: "Tairta hua gol sidebar aur Apple jaisa 'bento' grid — mukhtalif size ke tiles. Violet + pink, khula aur playful.",
  3: "Patli icon rail (sirf icons), zyada data ek screen pe — Linear/Vercel jaisa. Emerald green, sab se tez aur halka.",
  4: "Navy sidebar aur upar neela gradient header jis pe cards tairte hain. Ocean blue — bank/fintech jaisa bharosemand look.",
  5: "Upar menu, serif numbers (Playfair), rose + gold. Sab se elegant aur premium feel."
};
const I = {
  dash: '<path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z" fill="currentColor"/>',
  lead: '<path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5z" fill="currentColor"/>',
  dupe: '<path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 10-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z" fill="currentColor"/>',
  camp: '<path d="M3 11l18-7-7 18-2.5-7.5z" fill="currentColor"/>',
  prog: '<path d="M5 21V9h3v12zm7 0V3h3v18zm7 0v-7h3v7z" fill="currentColor"/>',
  call: '<path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.6 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.4 11.4 0 00.6 3.6 1 1 0 01-.25 1z" fill="currentColor"/>',
  tool: '<path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.7 4.7C.6 7.1 1 10.1 3 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1 0-1.4z" fill="currentColor"/>',
  users: '<path d="M16 11a3 3 0 100-6 3 3 0 000 6zm-8 0a3 3 0 100-6 3 3 0 000 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z" fill="currentColor"/>',
  copy: '<path d="M16 1H4a2 2 0 00-2 2v14h2V3h12zm3 4H8a2 2 0 00-2 2v14a2 2 0 002 2h11a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h11z" fill="currentColor"/>',
  search: '<path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 10-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z" fill="currentColor"/>',
  bell: '<path d="M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11a6 6 0 00-5-5.9V4a1 1 0 10-2 0v1.1A6 6 0 006 11v5l-2 2v1h16v-1z" fill="currentColor"/>',
  sun: '<circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>',
  moon: '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="currentColor"/>'
};
const AVC = ["#6366f1", "#06b6d4", "#f59e0b", "#ec4899", "#10b981", "#8b5cf6"];

/* ALIXO BPO mark — gradient rounded hexagon + shared-stem AB ligature (logo option 1). */
function mark(id) {
  return `<svg viewBox="0 0 100 100"><defs><linearGradient id="lg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient></defs>
    <path d="M46,7.3a8,8 0 0 1 8,0l31,17.9a8,8 0 0 1 4,6.9v35.8a8,8 0 0 1-4,6.9l-31,17.9a8,8 0 0 1-8,0l-31-17.9a8,8 0 0 1-4-6.9V32.1a8,8 0 0 1 4-6.9z" fill="none" stroke="url(#lg${id})" stroke-width="7"/>
    <g fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M29,70 L48,30"/><path d="M36.5,56 L48,56"/><path d="M50,29 V71"/><path d="M50,30 H60 a10,10 0 0 1 0,20 H50 M50,50 H63 a10,10 0 0 1 0,20 H50"/></g></svg>`;
}
const logo = id => `<a class="logo" href="#">${mark(id)}<div><b>ALIXO <span>BPO</span></b><small>Let's grow together</small></div></a>`;

function spark(pts) {
  const w = 200, h = 30, max = Math.max(...pts), min = Math.min(...pts);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${pts.map((p, i) => `${i ? "L" : "M"}${(i / (pts.length - 1)) * w},${h - 3 - ((p - min) / (max - min || 1)) * (h - 6)}`).join(" ")}"/></svg>`;
}
function wave(pts) {
  const w = 400, h = 120, max = Math.max(...pts);
  const xy = pts.map((p, i) => [(i / (pts.length - 1)) * w, h - (p / max) * (h - 14)]);
  let d = `M${xy[0]}`;
  for (let i = 1; i < xy.length; i++) { const cx = (xy[i - 1][0] + xy[i][0]) / 2; d += ` C${cx},${xy[i - 1][1]} ${cx},${xy[i][1]} ${xy[i]}`; }
  return `<svg class="wave" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d} L${w},${h} L0,${h}Z"/><path class="ln" d="${d}"/></svg>`;
}
function bars() {
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], a = [42, 55, 38, 61, 70, 48, 35], b = [30, 41, 29, 44, 52, 33, 22];
  const W = 520, gap = W / 7;
  let s = "";
  for (let i = 0; i < 5; i++) s += `<line x1="24" x2="${W}" y1="${10 + i * 40}" y2="${10 + i * 40}"/>`;
  days.forEach((d, i) => {
    const x = 36 + i * gap;
    s += `<rect x="${x}" y="${170 - a[i] * 2.2}" width="18" height="${a[i] * 2.2}" rx="6" style="fill:var(--accent);animation-delay:${i * 70}ms"/>`;
    s += `<rect x="${x + 22}" y="${170 - b[i] * 2.2}" width="18" height="${b[i] * 2.2}" rx="6" style="fill:var(--accent2);opacity:.55;animation-delay:${i * 70 + 40}ms"/>`;
    s += `<text x="${x + 20}" y="188" text-anchor="middle">${d}</text>`;
  });
  return `<svg class="bars" viewBox="0 0 ${W} 196">${s}</svg>`;
}

let D = +(location.hash.match(/d(\d)/) || [])[1] || 1;
let M = (location.hash.match(/m(dark|light)/) || [])[1] || "dark";

function render() {
  const navItems = [["Dashboard", I.dash], ["Lead Submission", I.lead], ["Dupe Checker", I.dupe], ["Active Campaigns", I.camp, 7], ["Callbacks", I.call], ["Progress", I.prog], ["Tools", I.tool]];
  const nav = `<nav class="nav">${navItems.map((n, i) => `<a href="#" class="${i === 0 ? "on" : ""}" title="${n[0]}"><svg viewBox="0 0 24 24">${n[1]}</svg><span class="t">${n[0]}</span>${n[2] ? `<span class="badge">${n[2]}</span>` : ""}</a>`).join("")}</nav>`;
  const actions = `
    <div class="search"><svg width="16" height="16" viewBox="0 0 24 24">${I.search}</svg>Search leads, phone…</div>
    <button class="ib theme-btn" title="Light / dark"><svg class="moon" viewBox="0 0 24 24">${I.moon}</svg><svg class="sun" viewBox="0 0 24 24">${I.sun}</svg></button>
    <span class="ib dot"><svg viewBox="0 0 24 24">${I.bell}</svg></span>
    <span class="av">OW</span>`;
  const topNav = D === 1 || D === 5;
  const leads = [
    ["6:02 PM", "Valerie Beard", "Owais", "MED CPL (ADO)", "OH", "ok"],
    ["5:38 PM", "Jill Sammons", "Sufiyan", "FE 180 (ADO)", "SC", "ok"],
    ["4:35 PM", "Virgil Gainey", "Ali", "MED CPL (ADO)", "PA", "dup"],
    ["2:25 PM", "Mary Frasier", "Wasiq", "180 FE SYED", "GA", "ok"],
  ];
  const agents = [["Owais", 57, "🥇"], ["Shafqat", 51, "🥈"], ["Alishba", 42, "🥉"], ["Ali", 38, "4"], ["Faiz", 33, "5"]];
  const stats = [["s1", "This week", 142, "+12%", I.prog, [8, 12, 9, 14, 13, 18, 22]], ["s2", "This month", 356, "+8%", I.users, [30, 28, 35, 33, 40, 44, 48]], ["s3", "Duplicates", 12, "-3", I.copy, [6, 5, 7, 4, 5, 3, 2]]];

  document.getElementById("mount").innerHTML = `
  <div class="frame d${D}" data-m="${M}">
    <div class="fx"><i></i><i></i></div>
    ${topNav ? `<header class="topnav">${logo("t")}${nav}<div class="right">${actions}</div></header>` : ""}
    <div class="shell">
      ${topNav ? "" : `<aside class="side">${logo("s")}<div class="navlbl">Menu</div>${nav}<div class="me"><span class="av" style="width:36px;height:36px;border-radius:10px;font-size:12px">OW</span><div><b>Owais</b><span>Agent · online</span></div></div></aside>`}
      <main class="main">
        <div class="topbar">
          <div><h1>Good evening, Owais 👋</h1><p>Tuesday, Sep 29 · 7:42 PM ET · Shift 7 PM – 3 AM</p></div>
          ${topNav ? "" : actions}
        </div>
        <div class="grid">
          <section class="tile hero">
            <div><div class="hi">Today's leads</div><div class="big" data-count="15">0</div><div class="sub"><span class="chip">▲ 25%</span> vs yesterday</div></div>
            <div class="goal"><svg viewBox="0 0 84 84"><circle class="t" cx="42" cy="42" r="36"/><circle class="v" cx="42" cy="42" r="36" style="--off:${226 * (1 - 15 / 20)}"/></svg><div><b>15 / 20</b><span>Daily target · 75%</span></div></div>
            ${wave([3, 5, 4, 8, 7, 11, 9, 13, 15])}
          </section>
          ${stats.map((s, i) => `
          <section class="tile stat ${s[0]}" style="animation-delay:${(i + 1) * 70}ms">
            <div class="ic"><svg viewBox="0 0 24 24">${s[4]}</svg></div>
            <div class="n" data-count="${s[2]}">0</div>
            <div class="l">${s[1]} <span class="chip">${s[3]}</span></div>
            ${spark(s[5])}
          </section>`).join("")}
          <section class="tile cb" style="animation-delay:280ms">
            <div class="stat"><div class="ic"><svg viewBox="0 0 24 24">${I.call}</svg></div></div>
            <h3 style="margin-bottom:6px">Callbacks sheet <span class="chip live">Access</span></h3>
            <p>Admin ne aapko callback sheet ka access diya hai. 23 callbacks pending.</p>
            <a href="#">Open sheet ↗</a>
          </section>
          <section class="tile chart" style="animation-delay:340ms">
            <h3>Leads this week <small>Submitted · Transferred</small></h3>${bars()}
          </section>
          <section class="tile agents" style="animation-delay:400ms">
            <h3>Top agents <small>this month</small></h3>
            ${agents.map((a, i) => `<div class="ag"><span class="medal">${a[2]}</span><span class="p" style="background:${AVC[i]}">${a[0].slice(0, 2).toUpperCase()}</span><div><b>${a[0]}</b><span>${7 - i} campaigns</span></div><div class="sc"><b data-count="${a[1]}">0</b><span> leads</span><div class="bar"><i style="width:${(a[1] / 57) * 100}%"></i></div></div></div>`).join("")}
          </section>
          <section class="tile table" style="animation-delay:460ms">
            <h3>Recent submissions <span class="chip live">Live</span><small>View all →</small></h3>
            <table><thead><tr><th>Customer</th><th>Agent</th><th>Campaign</th><th>State</th><th>Time</th><th>Status</th></tr></thead>
            <tbody>${leads.map((r, i) => `<tr><td><span class="who"><i style="background:${AVC[(i + 2) % 6]}">${r[1].split(" ").map(x => x[0]).join("")}</i>${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[0]}</td><td><span class="st ${r[5]}">${r[5] === "ok" ? "Submitted" : "Duplicate"}</span></td></tr>`).join("")}</tbody></table>
          </section>
          <section class="tile quick" style="animation-delay:520ms">
            <h3>Quick lead</h3>
            <label class="inp">Customer name<input placeholder="John Smith"></label>
            <label class="inp">Phone<input placeholder="(555) 555-5555"></label>
            <label class="inp">Campaign<select><option>MED CPL (ADO)</option></select></label>
            <button class="btn">Submit lead</button>
          </section>
        </div>
      </main>
    </div>
  </div>`;

  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 1200); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString(); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  document.querySelector(".theme-btn").onclick = toggleMode;
  document.getElementById("desc").textContent = DESC[D];
  document.getElementById("modeBtn").textContent = M === "dark" ? "☀️ Light mode" : "🌙 Dark mode";
  document.querySelectorAll("#picker [data-d]").forEach(b => b.classList.toggle("on", +b.dataset.d === D));
  try { history.replaceState(null, "", `#d${D}m${M}`); } catch {}
}
function toggleMode() {
  M = M === "dark" ? "light" : "dark";
  const f = document.querySelector(".frame");
  f.dataset.m = M;
  document.getElementById("modeBtn").textContent = M === "dark" ? "☀️ Light mode" : "🌙 Dark mode";
  try { history.replaceState(null, "", `#d${D}m${M}`); } catch {}
}
document.getElementById("picker").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "modeBtn") return toggleMode();
  D = +b.dataset.d; render();
});
render();
</script>
</body>
</html>
