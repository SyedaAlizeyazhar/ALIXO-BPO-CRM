<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALIXO BPO Logo Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Plus Jakarta Sans", sans-serif; background: #0d0f14; color: #e8ebf2; }
  header { padding: 28px 24px 8px; max-width: 1200px; margin: 0 auto; }
  header h1 { margin: 0; font-family: Outfit, sans-serif; font-size: 26px; }
  header p { margin: 6px 0 0; color: #8b93a5; font-size: 14px; }
  .grid { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; display: grid; gap: 28px; }
  .opt h2 { font-family: Outfit, sans-serif; font-size: 17px; margin: 0 0 4px; }
  .opt > p { margin: 0 0 14px; color: #8b93a5; font-size: 13.5px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { border-radius: 18px; padding: 38px 24px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .panel.light { background: #ffffff; color: #0f172a; }
  .panel.dark { background: #0b1020; color: #fff; }
  .lockup { display: flex; align-items: center; gap: 16px; }
  .lockup svg { width: 76px; height: 76px; flex: none; }
  .word b { display: block; font-family: Outfit, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: .04em; line-height: 1; }
  .word b span { font-weight: 500; opacity: .75; }
  .word small { display: block; margin-top: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase; opacity: .7; }
  .row { display: flex; gap: 22px; align-items: center; }
  .row svg { width: 44px; height: 44px; }
  .row .app { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; }
  .row .app svg { width: 42px; height: 42px; }
  .note { font-size: 11px; opacity: .55; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } .word b { font-size: 26px; } .lockup svg { width: 60px; height: 60px; } }
</style>
</head>
<body>
  <header>
    <h1>ALIXO BPO — logo options</h1>
    <p>Asal logo ka hexagon + "AB" monogram rakha hai, bas usay saaf, modern aur CRM ke rangon ke mutabiq banaya hai. Har option light aur dark dono pe.</p>
  </header>
  <div class="grid" id="grid"></div>

<script>
/* Pointy-top hexagon and a shared-stem "AB" ligature on a 100×100 grid. */
const HEX = "50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5";
const HEX_ROUND = "M46,7.3a8,8 0 0 1 8,0l31,17.9a8,8 0 0 1 4,6.9v35.8a8,8 0 0 1-4,6.9l-31,17.9a8,8 0 0 1-8,0l-31-17.9a8,8 0 0 1-4-6.9V32.1a8,8 0 0 1 4-6.9z";
const A = "M29,70 L48,30";           // left leg to the apex on the shared stem
const BAR = "M36.5,56 L48,56";         // A crossbar
const STEM = "M50,29 V71";
const B = "M50,30 H60 a10,10 0 0 1 0,20 H50 M50,50 H63 a10,10 0 0 1 0,20 H50";

const concepts = [
  {
    name: "1 · Gradient Monogram",
    desc: "Rounded hexagon ki outline indigo se cyan gradient mein, andar AB ek hi stem share karte hain. Sab se modern aur CRM ke Aurora/Midnight designs ke sath match.",
    svg: (id, dark) => `
      <svg viewBox="0 0 100 100"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
      <path d="${HEX_ROUND}" fill="none" stroke="url(#g${id})" stroke-width="6"/>
      <g fill="none" stroke="${dark ? "#fff" : "#0f172a"}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="${A}"/><path d="${BAR}"/><path d="${STEM}"/><path d="${B}"/></g></svg>`
  },
  {
    name: "2 · Grow Arrow",
    desc: "Tagline 'Let's Grow Together' ko logo mein daala — A ki tang ek upar jaata hua arrow ban jaati hai jo hexagon se bahar nikalta hai. Growth ka seedha paigham.",
    svg: (id, dark) => `
      <svg viewBox="0 0 100 100"><defs><linearGradient id="g${id}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#84cc16"/></linearGradient></defs>
      <polygon points="${HEX}" fill="none" stroke="${dark ? "rgba(255,255,255,.9)" : "#0f172a"}" stroke-width="5" stroke-linejoin="round" stroke-dasharray="190 18" stroke-dashoffset="-20"/>
      <g fill="none" stroke="${dark ? "#fff" : "#0f172a"}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="${BAR}"/><path d="${STEM}"/><path d="${B}"/></g>
      <path d="M22,78 L48,30 M48,30 L66,4" fill="none" stroke="url(#g${id})" stroke-width="7" stroke-linecap="round"/>
      <path d="M56,4 H68 V16" fill="none" stroke="url(#g${id})" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  },
  {
    name: "3 · Solid Badge",
    desc: "Poora hexagon gradient se bhara hua, AB safed mein. App icon, favicon aur WhatsApp DP ke liye sab se strong — chhote size pe bhi saaf dikhta hai.",
    svg: (id) => `
      <svg viewBox="0 0 100 100"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".55" stop-color="#db2777"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs>
      <path d="${HEX_ROUND}" fill="url(#g${id})"/>
      <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="${A}"/><path d="${BAR}"/><path d="${STEM}"/><path d="${B}"/></g></svg>`
  },
  {
    name: "4 · Classic Refined",
    desc: "Aapke asal logo ke sab se qareeb — seedha hexagon, bold AB — bas lines saaf, barabar moti aur navy + gold accent. Professional aur trustworthy.",
    svg: (id, dark) => `
      <svg viewBox="0 0 100 100">
      <polygon points="${HEX}" fill="none" stroke="${dark ? "#fff" : "#0b2447"}" stroke-width="6" stroke-linejoin="round"/>
      <polygon points="50,15 80,32.5 80,67.5 50,85 20,67.5 20,32.5" fill="none" stroke="#f5b301" stroke-width="1.8" stroke-linejoin="round"/>
      <g fill="none" stroke="${dark ? "#fff" : "#0b2447"}" stroke-width="7.5" stroke-linecap="square" stroke-linejoin="miter"><path d="${A}"/><path d="${BAR}"/><path d="${STEM}"/><path d="${B}"/></g></svg>`
  }
];

const APP_BG = ["linear-gradient(135deg,#1e1b4b,#0b1020)", "linear-gradient(135deg,#052e22,#0b1020)", "#fff", "#0b2447"];

document.getElementById("grid").innerHTML = concepts.map((c, i) => {
  const lock = (dark, k) => `
    <div class="lockup">${c.svg(`${i}${k}`, dark)}
      <div class="word"><b>ALIXO <span>BPO</span></b><small>Let's grow together</small></div>
    </div>`;
  return `
  <section class="opt">
    <h2>${c.name}</h2><p>${c.desc}</p>
    <div class="pair">
      <div class="panel light">${lock(false, "a")}
        <div class="row">${c.svg(`${i}c`, false)}<span class="note">sidebar / favicon size</span></div>
      </div>
      <div class="panel dark">${lock(true, "b")}
        <div class="row"><span class="app" style="background:${APP_BG[i]}">${c.svg(`${i}d`, true)}</span><span class="note">app icon / DP</span></div>
      </div>
    </div>
  </section>`;
}).join("");
</script>
</body>
</html>
